name: Build XNU Kernel for Tulip - Experimental

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm python3 libssl-dev zlib1g-dev wget curl git coreutils

      - name: Download Apple XNU Source
        run: |
          wget -O apple-xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8792.41.9.tar.gz
          tar -xzf apple-xnu.tar.gz --strip-components=1 -C xnu

      - name: Apply Deep Architecture, Xcrun and Sysctl Patches
        run: |
          cd xnu
          # Mimari ve LSE çakışma yamaları
          find makedefs/ -type f -exec sed -i 's/-march=armv8.[1-9]-a/-march=armv8-a/g' {} +
          find osfmk/ -name "*.h" -o -name "*.c" -o -name "*.s" -type f -exec sed -i 's/#if defined(__ARM_LSE__)/#if 0/g' {} +
          find osfmk/ -name "*.h" -o -name "*.c" -o -name "*.s" -type f -exec sed -i 's/#ifdef __ARM_LSE__/#if 0/g' {} +

          find . -type f \( -name "Makefile*" -o -name "*.cmd" -o -name "*.make" \) -exec sed -i 's|/usr/bin/xcrun|true|g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.cmd" -o -name "*.make" \) -exec sed -i 's|\bcrun\b|true|g' {} +

          # MakeInc.cmd içindeki sorunlu dinamik bloğu kapatıyoruz
          sed -i '465,495s/^/#/' makedefs/MakeInc.cmd

          # MakeInc.top içindeki word fonksiyonunu bypass ediyoruz
          sed -i '375s/.*/# bypassed word check/' makedefs/MakeInc.top

          # X86 varsayılanlarını ARM64 ve TULIP olarak Makefile seviyesinde kesin olarak zorluyoruz
          sed -i '1s/^/ARCH_CONFIG := ARM64\nMACHINE_CONFIG := TULIP\nPLATFORM := iPhoneOS\n/' Makefile

      - name: Re-apply Mock System Binaries
        run: |
          sudo rm -f /usr/bin/sysctl /bin/sysctl /usr/sbin/sysctl /sbin/sysctl
          sudo tee /usr/sbin/sysctl > /dev/null << 'EOF'
          #!/bin/sh
          if echo "$*" | grep -q "hw.memsize"; then
              echo "8589934592"
          elif echo "$*" | grep -q "hw.logicalcpu"; then
              echo "4"
          elif echo "$*" | grep -q "hw.physicalcpu"; then
              echo "2"
          else
              echo "8589934592"
          fi
          EOF
          sudo chmod +x /usr/sbin/sysctl
          sudo ln -sf /usr/sbin/sysctl /usr/bin/sysctl
          sudo ln -sf /usr/sbin/sysctl /bin/sysctl

          sudo rm -f /usr/bin/xcrun /bin/xcrun
          sudo tee /usr/bin/xcrun > /dev/null << 'EOF'
          #!/bin/sh
          exit 0
          EOF
          sudo chmod +x /usr/bin/xcrun

          sudo rm -f /usr/bin/sw_vers /bin/sw_vers
          sudo tee /usr/bin/sw_vers > /dev/null << 'EOF'
          #!/bin/sh
          echo "ProductVersion: 13.0"
          EOF
          sudo chmod +x /usr/bin/sw_vers

      - name: Create Custom Tulip Machine Config
        run: |
          cd xnu
          mkdir -p conf/tulip
          echo "ARCH_CONFIG = ARM64" > conf/tulip/Makefile.conf
          echo "MACHINE_CONFIG = TULIP" >> conf/tulip/Makefile.conf
          echo "KERNEL_CONFIGS = DEVELOPMENT" >> conf/tulip/Makefile.conf
          echo "HOST_OS_VERSION = 220000" >> conf/tulip/Makefile.conf
          echo "RC_ProjectSourceVersion = 8792" >> conf/tulip/Makefile.conf
          echo "RC_ProjectSourceRelease = 41" >> conf/tulip/Makefile.conf
          echo "RC_ProjectName = xnu" >> conf/tulip/Makefile.conf

      - name: Start Kernel Compilation
        run: |
          cd xnu
          make SDKROOT=iphoneos ARCH_CONFIG=ARM64 PLATFORM=iPhoneOS MACHINE_CONFIG=TULIP KERNEL_CONFIGS=DEVELOPMENT HOST_OS_VERSION=220000 RC_ProjectSourceVersion=8792 RC_ProjectSourceRelease=41 RC_ProjectName=xnu SKIP_HOST_VERSION_CHECK=1
