name: Build XNU Kernel for Tulip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm python3 libssl-dev zlib1g-dev wget curl git coreutils

      - name: Download Apple XNU Source
        run: |
          wget -O apple-xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8792.41.9.tar.gz
          tar -xzf apple-xnu.tar.gz --strip-components=1 -C xnu

      - name: Apply Architecture Downgrade and LSE Patches
        run: |
          cd xnu
          find makedefs/ -type f -exec sed -i 's/-march=armv8.[1-9]-a/-march=armv8-a/g' {} +
          find osfmk/ -name "*.h" -o -name "*.c" -o -name "*.s" -type f -exec sed -i 's/#if defined(__ARM_LSE__)/#if 0/g' {} +
          find osfmk/ -name "*.h" -o -name "*.c" -o -name "*.s" -type f -exec sed -i 's/#ifdef __ARM_LSE__/#if 0/g' {} +

      - name: Start Kernel Compilation
        run: |
          cd xnu
          
          # macOS'a özel komutları ve sysctl isteklerini Linux'ta hatasız taklit eden araçlar
          mkdir -p /tmp/bin
          
          cat << 'EOF' > /tmp/bin/xcrun
          exit 0
          EOF

          cat << 'EOF' > /tmp/bin/sw_vers
          echo "ProductVersion: 13.0"
          EOF

          cat << 'EOF' > /tmp/bin/sysctl
          # Make sisteminin beklediği saf sayısal değerleri doğrudan döndürüyoruz
          if echo "$*" | grep -q "hw.memsize"; then
              echo "8589934592"
          elif echo "$*" | grep -q "hw.logicalcpu"; then
              echo "4"
          elif echo "$*" | grep -q "hw.physicalcpu"; then
              echo "2"
          else
              echo "0"
          fi
          EOF

          chmod +x /tmp/bin/xcrun /tmp/bin/sw_vers /tmp/bin/sysctl
          export PATH="/tmp/bin:$PATH"

          # XNU make sistemine uygun doğru değişken adlarıyla derlemeyi tetikliyoruz
          make SDKROOT=iphoneos ARCH=arm64 KERNEL_CONFIGS="DEVELOPMENT" MACHINE_CONFIGS="TULIP" RC_CFLAGS="-arch arm64"
